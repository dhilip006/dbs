<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Xerox · Forge Your Prints</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<nav class="topnav">
  <a class="brand" href="/">SMART<span>XEROX</span></a>
  <a class="navlink" href="/admin">Shop Admin</a>
</nav>
<main>
  {% with messages=get_flashed_messages() %}{% if messages %}
  <div class="alerts">{% for m in messages %}<p>{{m}}</p>{% endfor %}</div>
  {% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Smart Xerox Portal · Prototype build</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
